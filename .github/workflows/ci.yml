name: planetarium

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:

jobs:
  build-planetarium:
    name: "build"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      # Use private tessellated-io/github-actions@v1. Public repos can't access private actions, so clone the actions repo locally and
      # rewrite references to point the actions correctly
      - name: Checkout private actions
        uses: actions/checkout@v7
        with:
          repository: tessellated-io/github-actions
          ref: v1
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          path: .private-actions
          persist-credentials: false

      - name: Rewrite private action references
        shell: bash
        run: |
          find .private-actions -type f \
            \( -name action.yml -o -name action.yaml \) \
            -exec sed -i -E \
              's#(uses:[[:space:]]*)\$/#\1./.private-actions/#g' \
              {} +

      - name: build planetarium
        uses: ./.private-actions/go/build-module
        with:
          module-file: go.mod
          github-access-token: ${{ secrets.GH_ACCESS_TOKEN }}

  test-planetarium:
    name: "test"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      # Use private tessellated-io/github-actions@v1. Public repos can't access private actions, so clone the actions repo locally and
      # rewrite references to point the actions correctly
      - name: Checkout private actions
        uses: actions/checkout@v7
        with:
          repository: tessellated-io/github-actions
          ref: v1
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          path: .private-actions
          persist-credentials: false

      - name: Rewrite private action references
        shell: bash
        run: |
          find .private-actions -type f \
            \( -name action.yml -o -name action.yaml \) \
            -exec sed -i -E \
              's#(uses:[[:space:]]*)\$/#\1./.private-actions/#g' \
              {} +

      - name: test planetarium
        uses: ./.private-actions/go/test-module
        with:
          module-file: go.mod
          github-access-token: ${{ secrets.GH_ACCESS_TOKEN }}

  lint-planetarium:
    name: "lint"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      # Use private tessellated-io/github-actions@v1. Public repos can't access private actions, so clone the actions repo locally and
      # rewrite references to point the actions correctly
      - name: Checkout private actions
        uses: actions/checkout@v7
        with:
          repository: tessellated-io/github-actions
          ref: v1
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          path: .private-actions
          persist-credentials: false

      - name: Rewrite private action references
        shell: bash
        run: |
          find .private-actions -type f \
            \( -name action.yml -o -name action.yaml \) \
            -exec sed -i -E \
              's#(uses:[[:space:]]*)\$/#\1./.private-actions/#g' \
              {} +

      - name: lint planetarium
        uses: ./.private-actions/go/lint
        with:
          module-file: go.mod
          github-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
